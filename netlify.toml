# Netlify configuration for the DEFAULT site built from this repository.
#
# This repository is a monorepo with two deployable front ends, and Netlify
# reads this root file when a site has no base directory configured. Without
# it, Netlify builds nothing and publishes the repository root — which has no
# index.html, so every URL 404s while /README.md loads. That is the symptom.
#
# `base` points the default site at the public map. With base set, `command`
# runs inside web/ and `publish` resolves to web/dist. Netlify also reads
# web/netlify.toml once it is in the base directory; the two agree.
#
# To make this default site the capture PWA instead, change `base` to
# "capture".
#
# THE SECOND SITE: create another Netlify site from this same repository and
# set its **base directory** to `capture` (Site configuration → Build & deploy
# → Build settings). A base directory set in the UI overrides this file, and
# Netlify then reads capture/netlify.toml.

[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 requires Node 20.19+ or 22.12+. Netlify's default has been older
  # than that, and the failure ("crypto.hash is not a function") does not
  # obviously point at the Node version.
  NODE_VERSION = "22"

  # The basemap ships with the site: web/public/harare.pmtiles is 5.9 MB, small
  # enough that hosting it on the same origin beats standing up a bucket, and it
  # sidesteps CORS entirely. Set in the repository rather than the dashboard
  # because neither value is a secret and a deploy should be reproducible from
  # a checkout. See ../infra/README.md#basemap-tiles.
  VITE_PMTILES_URL = "/harare.pmtiles"
  VITE_GLYPHS_URL = "/fonts/{fontstack}/{range}.pbf"

  # The GTFS feed is served from this origin too, because the API and the
  # pipeline run on different machines and the API has no copy of the file.
  # Publishing a feed means exporting into web/public/ and deploying.
  VITE_GTFS_URL = "/gtfs.zip"

  # The deployed API. Not a secret — it is a public URL the browser calls
  # directly — so it belongs in the repository next to the rest of the build
  # configuration rather than in the dashboard, where a redeploy from a fresh
  # checkout would silently lose it.
  #
  # Vite inlines this at build time, so changing it needs a rebuild, not a
  # restart. The API must also name this site in its CORS_ORIGINS, or the
  # browser blocks every request and the map reports the server as unreachable.
  VITE_API_BASE_URL = "https://kombi-api.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
